{% extends "base.html" %}
{% block title %}{{ news.title }} — Chercher SS{% endblock %}
{% block content %}

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            
            <!-- Back Button -->
            <a href="/" class="btn btn-outline-secondary mb-4"><i class="fas fa-arrow-left"></i> Back to Home</a>

            <!-- News Card -->
            <div class="card shadow border-0">
                {% if news.image %}
                    <img src="{{ news.image.url }}" class="card-img-top" alt="{{ news.title }}" style="max-height: 450px; object-fit: cover;">
                {% endif %}
                <div class="card-body p-4 p-md-5">
                    <h1 class="fw-bold mb-3">{{ news.title }}</h1>
                    <p class="text-muted small mb-4 border-bottom pb-3">
                        <i class="far fa-calendar-alt"></i> Posted on {{ news.created_at|date:"F d, Y" }}
                    </p>
                    
                    <!-- Full Content -->
                    <div class="fs-5" style="line-height: 1.8;">
                        {{ news.content|linebreaks }}
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
